[alembic]
# Path to migration scripts
script_location = app/migrations

# Database URL (use the role you confirmed: alvin_ndichu)
sqlalchemy.url = postgresql+psycopg2://alvin_ndichu:alvin2003ndichu@localhost:5432/smart_tourism_db

# Prepend current working directory to sys.path
prepend_sys_path = .

# Path separator for multiple paths
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
